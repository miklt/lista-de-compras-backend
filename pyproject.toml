[project]
name = "lista-de-compras-backend"
version = "1.0.0"
description = "API REST para lista de compras"
requires-python = ">=3.14"
license = "MIT"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
