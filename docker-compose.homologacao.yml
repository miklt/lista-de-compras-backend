services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lista_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lista_pass}
      POSTGRES_DB: ${POSTGRES_DB:-lista_compras_hml}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_hml:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lista_user} -d ${POSTGRES_DB:-lista_compras_hml}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lista_user}:${POSTGRES_PASSWORD:-lista_pass}@db:5432/${POSTGRES_DB:-lista_compras_hml}
      SECRET_KEY: ${SECRET_KEY:-homologacao-secret}
      DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data_hml:
